<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#6366f1;#8b5cf6;#d946ef;#06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#6366f1;#8b5cf6;#d946ef;#06b6d4;#3b82f6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#d946ef;#06b6d4;#3b82f6;#6366f1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#d946ef;#06b6d4;#3b82f6;#6366f1;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#d946ef">
        <animate attributeName="stop-color" values="#d946ef;#06b6d4;#3b82f6;#6366f1;#8b5cf6;#d946ef" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="wing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a">
        <animate attributeName="stop-color" values="#1e3a8a;#06b6d4;#1e3a8a" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#8b5cf6;#06b6d4" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#080810"/>

  <g transform="translate(256,256)">
    <!-- OUTER SQUARE — spins slowly clockwise, 18s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <rect x="-108" y="-108" width="216" height="216" rx="18" fill="none" stroke="url(#rainbow)" stroke-width="2.5" opacity="0.85" transform="rotate(45)"/>
    </g>

    <!-- MIDDLE SQUARE — spins counter-clockwise, 14s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
      <rect x="-76" y="-76" width="152" height="152" rx="14" fill="none" stroke="url(#rainbow)" stroke-width="2" opacity="0.55" transform="rotate(45)"/>
    </g>

    <!-- INNER SOLID DIAMOND — static anchor -->
    <rect x="-48" y="-48" width="96" height="96" rx="8" fill="url(#rainbow)" transform="rotate(45)" opacity="0.7" filter="url(#glow)"/>

    <!-- SPARKLES at the 4 cardinal points of outer square -->
    <g filter="url(#sparkle)">
      <!-- Top -->
      <circle cx="0" cy="-108" r="2" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0;0;0" dur="1.8s" begin="0.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-108" r="6" fill="#d946ef" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.7;0;0;0" dur="1.8s" begin="0.0s" repeatCount="indefinite"/>
      </circle>
      <!-- Bottom -->
      <circle cx="0" cy="108" r="2" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0;0;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="108" r="6" fill="#06b6d4" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.7;0;0;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <!-- Right -->
      <circle cx="108" cy="0" r="2" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0;0;0" dur="1.8s" begin="0.45s" repeatCount="indefinite"/>
      </circle>
      <circle cx="108" cy="0" r="6" fill="#8b5cf6" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.7;0;0;0" dur="1.8s" begin="0.45s" repeatCount="indefinite"/>
      </circle>
      <!-- Left -->
      <circle cx="-108" cy="0" r="2" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0;0;0" dur="1.8s" begin="1.35s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-108" cy="0" r="6" fill="#6366f1" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.7;0;0;0" dur="1.8s" begin="1.35s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- CROSS SPARKLES — where middle square corners graze the outer -->
    <g filter="url(#sparkle)">
      <!-- TR -->
      <circle cx="76" cy="-76" r="1.5" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.9;0;0" dur="2.2s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="76" cy="-76" r="5" fill="#d946ef" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.5;0;0" dur="2.2s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
      <!-- TL -->
      <circle cx="-76" cy="-76" r="1.5" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.9;0;0" dur="2.2s" begin="0.65s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-76" cy="-76" r="5" fill="#06b6d4" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.5;0;0" dur="2.2s" begin="0.65s" repeatCount="indefinite"/>
      </circle>
      <!-- BR -->
      <circle cx="76" cy="76" r="1.5" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.9;0;0" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="76" cy="76" r="5" fill="#8b5cf6" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.5;0;0" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- BL -->
      <circle cx="-76" cy="76" r="1.5" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.9;0;0" dur="2.2s" begin="1.75s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-76" cy="76" r="5" fill="#6366f1" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.5;0;0" dur="2.2s" begin="1.75s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- LEFT WING -->
    <path d="M0 -52 Q-70 -110 -120 -90 Q-95 -60 -80 -40 Q-65 -15 -35 15 Q-25 45 -15 70" fill="url(#wing)" opacity="0.5"/>

    <!-- RIGHT WING -->
    <path d="M0 -52 Q70 -110 120 -90 Q95 -60 80 -40 Q65 -15 35 15 Q25 45 15 70" fill="url(#wing)" opacity="0.5"/>

  </g>
</svg>