<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#6366f1;#8b5cf6;#d946ef;#06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#6366f1;#8b5cf6;#d946ef;#06b6d4;#3b82f6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#d946ef;#06b6d4;#3b82f6;#6366f1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#d946ef;#06b6d4;#3b82f6;#6366f1;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#d946ef">
        <animate attributeName="stop-color" values="#d946ef;#06b6d4;#3b82f6;#6366f1;#8b5cf6;#d946ef" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Wordmark gradient — same rainbow, left-to-right along text -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#6366f1;#d946ef;#06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#d946ef;#06b6d4;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#d946ef">
        <animate attributeName="stop-color" values="#d946ef;#06b6d4;#8b5cf6;#d946ef" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Wing gradient for transparent BG — more saturated -->
    <linearGradient id="wing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#06b6d4;#3b82f6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#8b5cf6;#06b6d4" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="sparkle">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Transparent background — no rect -->

  <!-- ===== LOGO MARK: left side, centered vertically ===== -->
  <g transform="translate(135,100)">

    <!-- Outer square — clockwise, 18s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <rect x="-68" y="-68" width="136" height="136" rx="12" fill="none" stroke="url(#rainbow)" stroke-width="2" opacity="0.9" transform="rotate(45)"/>
    </g>

    <!-- Middle square — counter-clockwise, 14s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
      <rect x="-48" y="-48" width="96" height="96" rx="10" fill="none" stroke="url(#rainbow)" stroke-width="1.5" opacity="0.6" transform="rotate(45)"/>
    </g>

    <!-- Inner solid diamond — static anchor -->
    <rect x="-30" y="-30" width="60" height="60" rx="6" fill="url(#rainbow)" transform="rotate(45)" opacity="0.75" filter="url(#glow)"/>

    <!-- Sparkles at cardinal points -->
    <g filter="url(#sparkle)">
      <circle cx="0" cy="-68" r="1.5" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0;0;0" dur="1.8s" begin="0.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-68" r="4" fill="#d946ef" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.7;0;0;0" dur="1.8s" begin="0.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="68" r="1.5" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0;0;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="68" r="4" fill="#06b6d4" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.7;0;0;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="68" cy="0" r="1.5" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0;0;0" dur="1.8s" begin="0.45s" repeatCount="indefinite"/>
      </circle>
      <circle cx="68" cy="0" r="4" fill="#8b5cf6" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.7;0;0;0" dur="1.8s" begin="0.45s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-68" cy="0" r="1.5" fill="#fff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0;0;0" dur="1.8s" begin="1.35s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-68" cy="0" r="4" fill="#6366f1" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.7;0;0;0" dur="1.8s" begin="1.35s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Left wing -->
    <path d="M0 -32 Q-44 -70 -75 -56 Q-60 -38 -50 -25 Q-40 -10 -22 10 Q-15 28 -10 44" fill="url(#wing)" opacity="0.5"/>

    <!-- Right wing -->
    <path d="M0 -32 Q44 -70 75 -56 Q60 -38 50 -25 Q40 -10 22 10 Q15 28 10 44" fill="url(#wing)" opacity="0.5"/>

  </g>

  <!-- ===== WORDMARK: right of logo ===== -->
  <g transform="translate(260,100)">
    <!-- Text with rainbow gradient -->
    <text x="0" y="14" font-family="SF Mono, Cascadia Code, Consolas, monospace" font-size="38" font-weight="800" fill="url(#text-grad)" letter-spacing="2">Reasonix</text>
    <text x="228" y="14" font-family="SF Mono, Cascadia Code, Consolas, monospace" font-size="38" font-weight="600" fill="url(#text-grad)" letter-spacing="2" opacity="0.85">-Hermes</text>

    <!-- Small diamond accent between Reasonix and Hermes -->
    <rect x="214" y="-8" width="8" height="8" rx="1" fill="url(#rainbow)" transform="rotate(45 218 -4)" opacity="0.8" filter="url(#glow)"/>

    <!-- Subtitle line -->
    <text x="0" y="34" font-family="SF Mono, Cascadia Code, Consolas, monospace" font-size="10" font-weight="500" fill="#64748b" letter-spacing="3" opacity="0.7">AI CODING AGENT</text>
  </g>

</svg>