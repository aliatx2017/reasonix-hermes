# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/.config/reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

# Config version marker for future schema migrations.
# config_version = 2

default_model = "deepseek" # a provider name (→ its default model) or "provider/model"
# language      = "zh"   # ui language; empty = auto-detect from $LANG / $REASONIX_LANG

[ui]
theme = "auto" # auto|dark|light; controls CLI colors only; REASONIX_THEME can override per run
# theme_style = "graphite"   # graphite|ember|aurora|midnight|sandstone|porcelain|linen|glacier
# shortcut_layout = "desktop"   # classic|desktop; compatibility setting; Shift+Tab toggles Plan, Ctrl+Y toggles YOLO
# show_reasoning = true   # CLI: show thinking text by default; false = collapsed (toggle with Ctrl+O)

[desktop]
# language = "zh"   # desktop UI language; empty/auto = browser/OS auto-detect (en|zh)
theme = "light" # auto|dark|light
# theme_style = "graphite"   # graphite|ember|aurora|midnight|sandstone|porcelain|linen|glacier
close_behavior = "background" # quit|background when the window close button is clicked
# display_mode = "standard"   # standard|compact; transcript display mode
status_bar_style = "text" # icon|text metric labels in the bottom status bar
status_bar_items = [
  "model",
  "cache",
  "cache_avg",
  "session_tokens",
  "turn_tokens",
  "turn_cost",
  "session_turns",
  "context",
  "compact",
  "cost",
  "balance",
]
check_updates = true # check for new versions on startup
telemetry = true # anonymous launch ping (install id + version + OS); never content
# metrics = false   # opt-in aggregate agent metrics (anonymous signal/bucket counts); never content
# provider_access = ["deepseek", "mimo-pro"]   # providers shown in desktop Settings > Model > Access
# expand_thinking = false   # show reasoning text expanded by default; false = collapsed

[desktop.hotbar]
# 1 = "palette"     # default: palette
# 2 = "workspace"   # default: workspace
# 3 = "new"         # default: new
# 4 = "history"     # default: history
# 5 = "dock"        # default: dock
# 6 = "sidebar"     # default: sidebar
# 7 = "settings"    # default: settings

[notifications]
enabled = false         # system notifications for CLI chat/run; default off
turn_done = true        # notify when a turn finishes
approval_request = true # notify when a tool approval is waiting
ask_request = true      # notify when a question is waiting
# sound = false          # bell/beep on turn completion

[agent]
system_prompt = """
You are Reasonix, a coding agent focused on executing code tasks.
Use the provided tools to read and write files and run shell commands.
Principles: understand the request before acting; verify with tools instead of
guessing; keep changes minimal and correct; briefly summarize what you did."""
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
max_steps         = 0    # executor tool-call rounds; 0 = no limit
planner_max_steps = 12   # planner read-only tool-call rounds; 0 = no limit
temperature       = 0.0
auto_plan         = "off"   # off|on; off keeps plan mode manual
# reasoning_language = "auto"   # visible reasoning text: auto|zh|en
# auto_plan_classifier = "deepseek-flash"   # optional; only used for borderline tasks
soft_compact_ratio = 0.5  # notice only; keeps the cache-first prefix intact
compact_ratio = 0.8       # try compacting when prompt reaches this fraction
compact_force_ratio = 0.9 # force compacting at this high-water mark
# planner_model = "mimo-pro"   # optional: enable two-model collaboration
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# subagent_effort = "high"   # optional default effort for subagents
# subagent_efforts = { review = "max", task = "high" }   # per-tool/skill effort overrides
# output_style = "explanatory"   # persona/tone folded into the prompt: explanatory | learning | concise,
#                                  or a custom .reasonix/output-styles/<name>.md ; empty = default

# Route background jobs to cheaper models so the main model focuses on reasoning.
# Each entry names a [[providers]] instance. Unset = reuse the main model.
# [agent.auxiliary]
#   [agent.auxiliary.compression]
#     provider = "ollamacloud-flash"
#     model = "deepseek-v4-flash"
#   [agent.auxiliary.vision]
#     provider = "ollamacloud-vision"
#     model = "gemini-3-flash-preview"   # multimodal; also try qwen3-vl:235b-instruct
#   [agent.auxiliary.web_extract]
#     provider = "ollamacloud-flash"
#     model = "deepseek-v4-flash"

# A provider is a vendor endpoint (one base_url + key) that offers one or more
# models. Use `models = [...]` to expose several under a single entry — switching
# models reuses the same connection; no need to re-declare base_url/api_key.
[[providers]]
name = "deepseek"
kind = "openai"
base_url = "https://api.deepseek.com"
models = ["deepseek-v4-flash", "deepseek-v4-pro"]
default = "deepseek-v4-flash"                                       # optional; defaults to the first of `models`
api_key_env = "DEEPSEEK_API_KEY"
context_window = 1000000
price = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" } # per 1M tokens
# DeepSeek thinking is always on; effort: high | max. Omit for auto (provider default).
effort = "high"

# A single-model provider still works (use `model = "..."`) — pick this form when a
# model needs its own base_url / context_window / price (e.g. the two MiMo SKUs
# below have different context windows).

[[providers]]
name = "mimo-pro"
kind = "openai"
base_url = "https://api.xiaomimimo.com/v1"
model = "mimo-v2.5-pro"                    # thinking-mode on by default; reasoning_content rendered dim above the answer
api_key_env = "MIMO_API_KEY"
context_window = 1000000

[[providers]]
name = "mimo-flash"
kind = "openai"
base_url = "https://api.xiaomimimo.com/v1"
model = "mimo-v2-flash"                    # thinking-mode off by default; cheaper / faster
api_key_env = "MIMO_API_KEY"
context_window = 65536

# Custom /effort levels for a provider. When supported_efforts is set, the
# /effort command exposes these levels; default_effort is what "/effort auto"
# (or unset) resolves to. Leave both commented to keep the built-in defaults
# (DeepSeek models: high|max; Anthropic: low|medium|high|xhigh|max). DeepSeek
# models behind a proxy are detected by model name; set reasoning_protocol =
# "none" to disable that or "openai" to force ordinary reasoning_effort.
# Other kinds (e.g. mimo-pro) don't expose /effort unless you opt in here.
#
# [[providers]]
# name           = "mimo-custom"
# kind           = "openai"
# base_url       = "https://token-plan-cn.xiaomimimo.com/v1"
# model          = "mimo-v2.5-pro"
# api_key_env    = "MIMO_API_KEY"
# reasoning_protocol = "openai"   # auto|deepseek|openai|none
# supported_efforts = ["low", "medium", "high"]
# default_effort    = "high"

# Anthropic (Claude) — the "anthropic" kind speaks the Messages API directly (no
# OpenAI shim). base_url is optional (defaults to https://api.anthropic.com). Note:
# this provider does not enable extended thinking and does not send temperature —
# current Claude models reject sampling params (see internal/provider/anthropic).
[[providers]]
name = "claude"
kind = "anthropic"
model = "claude-opus-4-8"
api_key_env = "ANTHROPIC_API_KEY"
context_window = 1000000
price = { cache_hit = 0.5, input = 5, output = 25, currency = "$" } # per 1M tokens
# Extended thinking (anthropic kind only; round-trips the signed reasoning block
# across tool calls). Omit to disable. effort: low | medium | high | xhigh | max.
thinking = "adaptive"
effort = "high"

# MiniMax — OpenAI-compatible provider. The "openai" kind detects minimaxi.com
# hosts and uses M3's binary thinking knob (adaptive/disabled).
# [[providers]]
# name = "minimax"
# kind = "openai"
# base_url = "https://api.minimaxi.com/v1"
# model = "minimax-m3"
# api_key_env = "MINIMAX_API_KEY"
# context_window = 1000000
# effort = "adaptive"   # adaptive | disabled; also supports vision (image) input

# GLM (ZhipuAI / Z.ai) — OpenAI-compatible provider with standard reasoning_effort
# (low/medium/high). The "openai" kind auto-detects bigmodel.cn hosts.
# [[providers]]
# name = "glm"
# kind = "openai"
# base_url = "https://open.bigmodel.cn/api/paas/v4"
# model = "glm-4.5"
# api_key_env = "GLM_API_KEY"
# context_window = 128000
# effort = "high"

# Ollama Cloud — OpenAI-compatible provider kind. Defaults to
# https://api.ollama.com/v1. Model names support colon-delimited tags
# (e.g. gemma4:31b, deepseek-v4-pro). Good for cheap auxiliary models.
# [[providers]]
# name = "ollamacloud-flash"
# kind = "ollamacloud"
# model = "deepseek-v4-flash"
# api_key_env = "OLLAMA_API_KEY"
# context_window = 256000
# price = { input = 0.10, output = 0.30, currency = "$" } # per 1M tokens
# vision = false   # set true for vision models like qwen3-vl:235b-instruct

[tools]
enabled = []               # empty = all built-in tools
bash_timeout_seconds = 120 # foreground safety cap; set 0 for no tool-local cap

[tools.search]
# engine = "auto"   # auto|native|rg; auto uses ripgrep when on PATH, else native Go scanner
# rg_path = ""      # optional explicit ripgrep binary path

[tools.shell]
# prefer = "auto"   # auto|bash|powershell|pwsh; auto = real bash on unix, PowerShell on Windows
# path = ""         # optional explicit shell executable path

# CodeGraph code intelligence (symbol/call-graph search via tree-sitter + SQLite),
# a built-in MCP server giving the agent codegraph_* search / context / explore /
# trace / node tools. Off by default for first-run sessions. Once enabled, the
# runtime is fetched into a per-version cache when missing (auto_install);
# .codegraph/ is then initialised (fast) and CodeGraph's daemon indexes in the
# background once enabled.
# [codegraph]
# enabled      = false
# auto_install = true
# path         = ""   # empty = cache, then PATH, then a bundle beside reasonix

# Built-in MCP servers that ship with Reasonix — off until manually enabled.
[builtin_mcp]
time_enabled = true      # built-in Time MCP server
context7_enabled = false # built-in Context7 documentation MCP server

# Skills are invokable playbooks (SKILL.md / <name>.md with frontmatter), found
# under .reasonix/skills, .agents/skills, .agent/skills, .claude/skills (project)
# and the same dirs under ~ (global). Built-ins (explore/research/review/security-review/test)
# ship out of the box. The model invokes them via run_skill / explore / …; you
# invoke them via /<name>. Manage with /skill (list, show, enable, disable, new, paths).
# [skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra "custom"-scope skill roots
# excluded_paths = ["~/.agents/skills"]         # hide convention roots without deleting folders
# disabled_skills = ["review"]                  # hide from prompt, slash invocation, and skill tools
# max_depth = 3                                  # nested scan depth; set 1 for legacy root-only discovery

# Hooks run shell commands around the loop (PreToolUse / PostToolUse /
# PermissionRequest / UserPromptSubmit / Stop). They are NOT configured here — put them in
# settings.json: ~/.reasonix/settings.json (global, always on) and
# <project>/.reasonix/settings.json (project, runs only after `/hooks trust`).
# Exit 0 = pass, exit 2 = block (PreToolUse / UserPromptSubmit only). Example
# ~/.reasonix/settings.json:
#   { "hooks": {
#       "PreToolUse":  [ { "match": "bash", "command": "my-guard.sh" } ],
#       "PermissionRequest": [ { "match": "bash", "command": "notify-send 'approval needed'" } ],
#       "PostToolUse": [ { "match": ".*file", "command": "gofmt -w ." } ],
#       "Stop":        [ { "command": "notify-send 'turn done'" } ] } }

# Language Server Protocol — agent-accessible IDE-like tools (definition, hover,
# references, diagnostics). Servers launch lazily the first time they are used.
[lsp]
enabled = true # language server tools; servers launch lazily when used

# [lsp.servers.go]
# command = "gopls"
# args = []
# env = {}
# language_id = "go"
# extensions = [".go"]
# install_hint = "go install golang.org/x/tools/gopls@latest"

# [lsp.servers.rust]
# command = "rust-analyzer"
# extensions = [".rs"]

# Proxy/network settings for API calls to LLM providers.
[network]
proxy_mode = "auto" # auto|env|custom|off; auto currently uses environment proxy
# proxy_url  = "socks5://127.0.0.1:7890"   # optional custom override
# no_proxy   = "localhost,127.0.0.1,.local"   # honored when proxy_mode = "custom"

# [network.proxy]
# type = "socks5"   # http|https|socks5|socks5h
# server = "127.0.0.1"
# port = 7890
# username = ""
# password = "${REASONIX_PROXY_PASSWORD}"   # optional; supports ${VAR} expansion

# Tool-call permission gating. mode = writer fallback when no rule matches.
# Readers always default to allow. Precedence: deny > ask > allow > fallback.
[permissions]
mode = "ask" # ask|allow|deny
# deny = ["Bash(rm -rf*)", "Bash(git push*)"]   # hard-blocked in every mode
# allow = ["Bash(go test:*)", "Bash(git status:*)"]   # never prompted
# ask = ["Edit(src/**)"]   # force a prompt even if otherwise allowed

# File-writer confinement and bash sandboxing.
[sandbox]
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash = "enforce" # enforce (OS sandbox) | off; macOS Seatbelt, Linux bubblewrap
network = true
# remote_sandbox_url = ""        # API endpoint for remote sandbox backend (OpenSandbox)
# remote_sandbox_token = ""      # bearer auth token for the remote sandbox API

# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow"} as JSON on stdin.
# [statusline]
# command = "my-statusline.sh"

# External stdio plugins (MCP-compatible); each is a standalone executable.
# [[plugins]]
# name    = "example"
# command = "reasonix-plugin-example"
# # Enabled MCP servers connect automatically in the background after session
# # start. Use /mcp or the desktop MCP panel to refresh, reconnect, or disable.

# Multi-agent collaboration via collab-cli (17 free tools: handshake, tasks,
# SHARD.md, agent commands, self-review, LAN sync, web dashboard).
# Install: go install github.com/cejkato/collab-cli@latest
# [[plugins]]
# name    = "collab"
# command = "collab"
# args    = ["mcp"]
# env     = { COLLAB_LOG_LEVEL = "warn" }   # environment variables for the subprocess
# auto_start = true   # connect at session startup (default: true)
# tier       = "background"   # eager|lazy|background; startup connection strategy

# HTTP/SSE MCP plugin — no local command; talks to a remote server.
# [[plugins]]
# name    = "stripe"
# type    = "http"
# url     = "https://mcp.stripe.com"
# headers = { Authorization = "Bearer ${STRIPE_KEY}" }

# --- Named profiles: switch with /profile or set active_profile below. ---
# Each profile can override model, effort, tool-approval mode, auto-plan,
# output style, system prompt prefix, and yolo mode. Use /profile list to
# see available profiles; /profile <name> to switch at runtime.
# active_profile = "fast"   # named profile to activate at startup; "" = none

# [profiles.fast]
# description = "Fast and cheap for quick edits"
# model = "deepseek-flash"
# effort = "high"
# tool_approve_mode = "yolo"
# auto_plan = "off"
# output_style = "concise"
# system_prompt_prefix = ""
# yolo = false

# [profiles.deep]
# description = "Deep reasoning for complex tasks"
# model = "deepseek-pro"
# effort = "max"
# tool_approve_mode = "ask"
# auto_plan = "on"
# output_style = "explanatory"
# system_prompt_prefix = "Think step by step."
# yolo = false

# --- Provider extensions ---
# Per-provider fields recognized by all [[providers]] entries:
#   models_url = "https://api.example.com/v1/models"   # auto-fetch model list on startup
#   vision = false          # set true for models that accept image input
#   vision_detail = "auto"  # image detail hint: low|high; empty = auto
#   no_proxy = true         # reach this base_url directly, never via the proxy

# ── Token-saving MCP plugins ──────────────────────────────────────────────
# sqz: Rust CLI that compresses LLM context by 25-92% via SHA-256 content cache
# and repeated-line dedup. Safe mode preserves errors and stack traces.
# Install: cargo install sqz-cli && sqz init
# [[plugins]]
# name    = "sqz"
# command = "sqz"
# args    = ["mcp"]

# context-mode: TypeScript tool-output sandboxing — up to 98% token reduction.
# Used by Microsoft, Google, Meta. Hacker News #1 (570+ points).
# Install: npm install -g context-mode
# [[plugins]]
# name    = "context-mode"
# command = "context-mode"
# args    = ["mcp"]

# Bot gateway: multi-channel IM bot for QQ, Feishu, WeChat, and Discord.
# Start with `reasonix bot start --channels qq,feishu,weixin`.
# All secrets are read from environment variables; never put keys here.
# [bot]
# enabled    = false
# model      = ""        # 用于 bot 的模型，空则用 default_model
# max_steps  = 25
# debounce_ms = 1500      # 消息合并窗口（毫秒）
# tool_approval_mode = "ask"   # ask|auto|yolo; yolo skips tool approvals only
#
# [bot.allowlist]
# enabled     = true
# allow_all   = false     # true 会允许所有可触达用户远程触发 bot，仅限受控环境
# qq_users    = []
# feishu_users = []
# weixin_users = []
# qq_groups   = []
# feishu_groups = []
# weixin_groups = []
# discord_users = []
# discord_groups = []
# telegram_users = []
# telegram_groups = []
#
# [bot.qq]
# enabled        = false
# app_id         = ""
# app_secret_env  = "QQ_BOT_APP_SECRET"
# sandbox        = false   # true 使用 QQ 沙箱 API / gateway
#
# [bot.feishu]
# enabled             = false
# app_id              = ""
# app_secret_env       = "FEISHU_BOT_APP_SECRET"
# verification_token   = ""
# mode                = "webhook"   # webhook | websocket（websocket 需接官方 SDK 长连接）
# webhook_port        = 8080
# require_mention     = true
# domain              = "feishu"   # feishu | lark
#
# [bot.weixin]
# enabled   = false
# account_id = "default"
# token_env = "WEIXIN_BOT_TOKEN"
# api_base  = "https://ilinkai.weixin.qq.com"   # Tencent iLink Bot API base URL

# [bot.discord]
# enabled = false
# token_env = "DISCORD_BOT_TOKEN"
# server_id = ""
# channel_id = ""
# allow_dms = true
# webhook_url_env = "DISCORD_WEBHOOK_URL"

# [bot.telegram]
# enabled = false
# token_env = "TELEGRAM_BOT_TOKEN"
# allow_dms = true

# ── Scheduled Tasks ─────────────────────────────────────────────────────────
# Cron-driven automated agent tasks. The scheduler runs in the background while
# the agent is active and fires each task at its scheduled time. Results are
# stored and visible on the desktop Hermes dashboard.

# [schedule]
# [[schedule.tasks]]
# name    = "daily-review"
# cron    = "0 2 * * *"           # every day at 2am
# prompt  = "Review all changes in the last 24 hours. Report any issues."
# model   = "deepseek-flash"      # optional; empty = use default_model
# enabled = true
#
# [[schedule.tasks]]
# name    = "weekly-summary"
# cron    = "0 9 * * 1"           # Monday 9am
# prompt  = "Summarize this week's work. What was accomplished? What's pending?"
# model   = "deepseek-pro"

# ── Self-Improving Skill Loops ──────────────────────────────────────────────
# The learner observes agent behaviour across turns, detects repeated tool/skill
# patterns, and triggers a post-session reflection turn to generate new or
# updated SKILL.md files automatically.

# [learn]
# enabled        = true
# max_patterns   = 20     # max patterns to detect
# min_confidence = 3      # observations before a pattern forms

# ── Agent-to-Agent MCP Mesh ─────────────────────────────────────────────────
# The mesh lets Reasonix instances delegate tasks to each other. Each peer is
# another Reasonix instance running as an MCP server. Council mode broadcasts a
# task to all peers and synthesises their answers.

# [mesh]
# enabled = false
#
# [[mesh.peers]]
# name     = "staging-agent"
# url      = "http://staging.example.com:9090/mcp"
# token_env = "MESH_STAGING_TOKEN"
# enabled  = true
#
# [[mesh.peers]]
# name     = "prod-planner"
# url      = "http://prod.example.com:9090/mcp"
# token_env = "MESH_PROD_TOKEN"
# enabled  = true

# ── Live Collaboration ─────────────────────────────────────────────────────
# The collab hub lets other Reasonix instances watch a session in real-time
# via WebSocket. Watchers receive turn events, tool calls, and results. They
# can optionally send steer commands to guide the agent mid-turn.

# [collab]
# enabled     = false
# listen_addr = ":9091"
