topic: AI for Small & Medium Business — Opportunities 2026
items:
  - name: ChatGPT for Business (OpenAI)
    description: General-purpose AI assistant for SMBs — content creation, coding, customer support, data analysis. GPT-5 Turbo model with Team/Enterprise plans.
  - name: Microsoft Copilot for Business
    description: AI integrated into Microsoft 365 suite — Word, Excel, PowerPoint, Teams, Outlook. Productivity automation for SMBs already on Microsoft stack.
  - name: Google Workspace AI (Gemini)
    description: Google's AI across Gmail, Docs, Sheets, Meet, Drive. Competing head-to-head with Microsoft Copilot for the productivity suite SMB market.
  - name: Salesforce Einstein GPT
    description: CRM-native AI for sales forecasting, lead scoring, email generation, customer insights. Geared toward SMBs with Sales/Service Cloud.
  - name: HubSpot AI
    description: Marketing, sales, and service automation AI. Content Assistant, ChatSpot conversational CRM, predictive lead scoring — popular with SMB marketing teams.
  - name: Zoho AI (Zia)
    description: AI assistant across Zoho's 40+ business apps (CRM, Books, People, Desk). Full-suite AI for price-sensitive SMBs.
  - name: Notion AI
    description: AI-powered knowledge management, docs, wikis, project management. Strong adoption among SMBs for internal documentation and collaboration.
  - name: Jasper AI
    description: Marketing-focused AI content generation — blog posts, social media, ad copy, email campaigns. Positioned as "AI co-pilot for marketing teams."
  - name: Freshworks Freddy AI
    description: AI for customer support/helpdesk — ticket routing, auto-responses, sentiment analysis, self-service chatbots. Targets SMB support teams.
  - name: QuickBooks AI / Intuit Assist
    description: AI for small business accounting — automated categorization, invoice generation, cash flow forecasting, tax prep. Embedded in QuickBooks Online.
execution:
  batch_size: 5
  items_per_agent: 1
  output_dir: ./results
