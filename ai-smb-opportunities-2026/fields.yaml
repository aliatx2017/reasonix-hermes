fields:
  - category: Basics
    fields:
      - name: category
        description: Product category (productivity suite, CRM, marketing, support, accounting, general AI)
        detail_level: brief
      - name: pricing_tiers
        description: Pricing tiers and starting price per seat/month for SMB-relevant plans
        detail_level: moderate
      - name: free_tier_available
        description: Whether a free tier or free trial exists
        detail_level: brief
      - name: latest_major_release
        description: Most recent major version or feature release date
        detail_level: brief
  - category: Features
    fields:
      - name: key_capabilities
        description: Core AI capabilities (content generation, data analysis, automation, conversational, predictive)
        detail_level: moderate
      - name: integrations
        description: Key third-party integrations and ecosystem connectors (number and notable names)
        detail_level: moderate
      - name: smb_onboarding_time
        description: Typical time to onboard for a 5-50 employee business (hours/days)
        detail_level: brief
      - name: mobile_support
        description: Mobile app availability and quality (iOS/Android/web)
        detail_level: brief
  - category: Market Position
    fields:
      - name: target_company_size
        description: Ideal customer size range (1-10, 10-50, 50-250, 250+ employees)
        detail_level: moderate
      - name: estimated_smb_users
        description: Estimated number of SMB customers or active users
        detail_level: brief
      - name: market_differentiator
        description: Primary competitive advantage vs alternatives
        detail_level: moderate
      - name: key_competitors
        description: Direct competitors in the same category
        detail_level: brief
  - category: ROI & Adoption
    fields:
      - name: typical_roi_claim
        description: Vendor-claimed or analyst-reported ROI (time savings, revenue increase, cost reduction)
        detail_level: moderate
      - name: smb_adoption_trend
        description: Adoption trajectory among SMBs (growing, stable, declining) with evidence
        detail_level: moderate
      - name: notable_smb_case_studies
        description: Real SMB case studies with measurable outcomes
        detail_level: moderate
  - category: Ecosystem
    fields:
      - name: backing_company
        description: Parent company or primary backer
        detail_level: brief
      - name: funding_to_date
        description: Total funding raised (if startup) or parent company revenue context
        detail_level: brief
      - name: partner_ecosystem
        description: Reseller, SI, and technology partner network size/quality
        detail_level: moderate
      - name: community_support
        description: User community, documentation quality, training resources available
        detail_level: brief
