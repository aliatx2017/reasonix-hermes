apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reasonix.fullname" . }}-secrets
  labels:
    {{- include "reasonix.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  {{- if .Values.components.bot.enabled }}
  DISCORD_BOT_TOKEN: {{ .Values.secrets.discordBotToken | quote }}
  {{- end }}
  {{- if .Values.secrets.meshToken }}
  MESH_TOKEN: {{ .Values.secrets.meshToken | quote }}
  {{- end }}
