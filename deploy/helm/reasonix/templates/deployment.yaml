apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reasonix.fullname" . }}
  labels:
    {{- include "reasonix.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "reasonix.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "reasonix.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        {{- if .Values.components.bot.enabled }}
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/reasonix-bot"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: {{ include "reasonix.fullname" . }}-secrets
          env:
            - name: REASONIX_CONFIG
              value: /etc/reasonix/reasonix.toml
          volumeMounts:
            - name: config
              mountPath: /etc/reasonix
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- end }}

        {{- if .Values.components.mcpbridge.enabled }}
        - name: mcpbridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/reasonix-mcpbridge", "--http", "--port", "{{ .Values.service.mcpbridgePort }}"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.mcpbridgePort }}
              name: mcp
          envFrom:
            - secretRef:
                name: {{ include "reasonix.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- end }}

        {{- if .Values.components.memoryserver.enabled }}
        - name: memoryserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/reasonix-memoryserver", "--http", "--port", "{{ .Values.service.memoryPort }}"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.memoryPort }}
              name: memory
          envFrom:
            - secretRef:
                name: {{ include "reasonix.fullname" . }}-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- end }}

      volumes:
        - name: config
          configMap:
            name: {{ include "reasonix.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "reasonix.fullname" . }}-data
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
