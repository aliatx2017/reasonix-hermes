apiVersion: v1
kind: Service
metadata:
  name: {{ include "reasonix.fullname" . }}
  labels:
    {{- include "reasonix.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.components.mcpbridge.enabled }}
    - port: {{ .Values.service.mcpbridgePort }}
      targetPort: mcp
      name: mcp
    {{- end }}
    {{- if .Values.components.memoryserver.enabled }}
    - port: {{ .Values.service.memoryPort }}
      targetPort: memory
      name: memory
    {{- end }}
    {{- if .Values.service.type }}
    - port: {{ .Values.service.collabPort }}
      targetPort: collab
      name: collab
    {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "reasonix.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
