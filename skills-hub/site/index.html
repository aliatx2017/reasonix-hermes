<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reasonix Hermes — Skills Hub</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --orange: #d2991d;
  --purple: #a371f7;
  --red: #f85149;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 2rem 1.5rem; text-align: center; }
header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
header p { color: var(--muted); font-size: 0.95rem; }
.container { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
.filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.15s; }
.filter-btn:hover { border-color: var(--accent); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.stats { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem; margin-bottom: 0.75rem; transition: border-color 0.15s; }
.card:hover { border-color: var(--accent); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.5rem; }
.card-name { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
.card-badges { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; }
.badge { font-size: 0.72rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 500; white-space: nowrap; }
.badge-cat { background: rgba(88,166,255,0.12); color: var(--accent); }
.badge-sub { background: rgba(163,113,247,0.12); color: var(--purple); }
.badge-inline { background: rgba(63,185,80,0.12); color: var(--green); }
.card-desc { color: var(--muted); font-size: 0.88rem; }
.card-meta { margin-top: 0.5rem; font-size: 0.78rem; color: var(--muted); display: flex; gap: 1rem; }
footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.82rem; border-top: 1px solid var(--border); margin-top: 2rem; }
footer a { color: var(--accent); text-decoration: none; }
.error { color: var(--red); text-align: center; padding: 2rem; }
</style>
</head>
<body>
<header>
  <h1>🧠 Reasonix Hermes Skills Hub</h1>
  <p id="subtitle">Loading skills&hellip;</p>
</header>

<div class="container">
  <div id="content"></div>
</div>

<footer>
  <p>Part of <a href="https://github.com/aliatx2017/reasonix-hermes">aliatx2017/reasonix-hermes</a> — install via <code>reasonix install-source</code></p>
</footer>

<script>
const CAT_LABELS = {};
let REGISTRY = { skills: [], categories: [{name:"all",label:"All"}] };
let activeCat = 'all';

function render() {
  const filtered = activeCat === 'all'
    ? REGISTRY.skills
    : REGISTRY.skills.filter(s => s.category === activeCat);

  const subtitle = document.getElementById('subtitle');
  subtitle.textContent = REGISTRY.skills.length === 0
    ? 'Loading skills…'
    : `${REGISTRY.skills.length} community skills for the Reasonix AI coding agent`;

  const cats = REGISTRY.categories.length > 1 ? REGISTRY.categories
    : [{name:"all",label:"All"}, ...new Map(REGISTRY.skills.map(s => [s.category, {name:s.category,label:s.category.charAt(0).toUpperCase()+s.category.slice(1)}])).values()];

  const container = document.getElementById('content');
  container.innerHTML = `
    <div class="stats" id="stats">Showing ${filtered.length} of ${REGISTRY.skills.length} skills</div>
    <div class="filters" id="filters">${cats.map(c =>
      `<button class="filter-btn${c.name===activeCat?' active':''}" data-cat="${c.name}">${c.label}</button>`
    ).join('')}</div>
    <div id="cards">${filtered.map(s => `
      <div class="card">
        <div class="card-header">
          <span class="card-name">${s.name}</span>
          <div class="card-badges">
            <span class="badge badge-cat">${CAT_LABELS[s.category] || s.category}</span>
            <span class="badge ${s.runAs==='subagent'?'badge-sub':'badge-inline'}">${s.runAs==='subagent' ? '🧬 subagent' : '📋 inline'}</span>
          </div>
        </div>
        <div class="card-desc">${s.description}</div>
        <div class="card-meta"><span>by ${s.author}</span></div>
      </div>
    `).join('')}</div>`;

  document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    activeCat = btn.dataset.cat;
    render();
  });
}

fetch('registry.json')
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(data => {
    REGISTRY = Array.isArray(data) ? { skills: data, categories: [] } : data;
    REGISTRY.categories.forEach(c => CAT_LABELS[c.name] = c.label);
    render();
  })
  .catch(() => {
    document.getElementById('content').innerHTML = '<div class="error">Could not load skill registry. Please check the repository.</div>';
  });
</script>
</body>
</html>
