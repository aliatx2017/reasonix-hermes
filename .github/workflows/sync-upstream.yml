name: Sync Upstream

# Discontinued 2026-07-21: Hermes has intentionally diverged from upstream,
# so the daily schedule is disabled. It had also been silently failing every
# run since 2026-06-23 — the default GITHUB_TOKEN lacks the `workflows`
# permission needed to push a conflict-resolution branch that touches
# .github/workflows/*.yml, so the "open a PR for manual resolution" fallback
# never actually succeeded. Kept as workflow_dispatch only, in case a manual
# upstream pull is ever wanted again.
on:
  workflow_dispatch:  # manual trigger from GitHub UI only — no schedule

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/esengine/deepseek-reasonix.git
          git fetch upstream main-v2

      - name: Attempt merge
        id: merge
        run: |
          if git merge --no-edit upstream/main-v2; then
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Smoke test (Go build + test)
        if: steps.merge.outputs.merged == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build and test
        if: steps.merge.outputs.merged == 'true'
        run: |
          go build -o /usr/local/bin/reasonix ./cmd/reasonix
          go build ./...
          # mcpbridge tests require skills hub installation (integration tests), skip in smoke check
          go test ./cmd/reasonix-hooks/... ./cmd/reasonix-memoryserver/... ./pkg/... ./internal/bot/... ./bot/...

      - name: Push merged main
        if: steps.merge.outputs.merged == 'true'
        run: git push origin main

      - name: Create conflict PR
        if: steps.merge.outputs.merged != 'true'
        run: |
          BRANCH="sync/upstream-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "WIP: upstream sync $(date +%Y-%m-%d) — CONFLICTS" || true
          git push origin "$BRANCH" --force

          gh pr create \
            --repo ${{ github.repository }} \
            --head "$BRANCH" \
            --base main \
            --title "⬆️ Upstream sync $(date +%Y-%m-%d) — manual merge needed" \
            --body "Automated sync from upstream \`main-v2\` hit conflicts. Manual resolution required.

          **Conflicted files:** see the diff.
          **Commands to resolve locally:**
          \`\`\`sh
          git fetch upstream main-v2
          git merge upstream/main-v2
          # resolve conflicts, then:
          git push origin main
          \`\`\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
