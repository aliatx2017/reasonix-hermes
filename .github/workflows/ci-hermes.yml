name: Hermes CI
on: [push, pull_request]

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  desktop-frontend:
    name: Desktop Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd desktop/frontend && npm ci
      - run: cd desktop/frontend && npm run build

  hermes-packages:
    name: Hermes Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build Hermes binaries
        run: |
          go build -o /dev/null ./cmd/reasonix-mcpbridge
          go build -o /dev/null ./cmd/reasonix-memoryserver
          go build -o /dev/null ./bot
          go build -o /dev/null ./cmd/reasonix-hooks
      - name: Test Hermes packages
        run: |
          go test -v -count=1 ./pkg/...
          go test -v -count=1 ./internal/bot/...
      - name: Test hook integration
        run: |
          bash scripts/test-hooks-integration.sh
