name: Hermes CI
on: [push, pull_request]

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  desktop-frontend:
    name: Desktop Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: cd desktop/frontend && npm ci
      - name: Biome check (format + lint)
        uses: biomejs/setup-biome@v2
        with:
          version: '1.9.4'
      - run: biome check desktop/frontend
      - run: cd desktop/frontend && npm run build

  desktop-build:
    name: Desktop Wails Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build desktop binary
        run: |
          wails generate module
          pnpm --dir frontend install --frozen-lockfile
          wails build -clean

  hermes-packages:
    name: Hermes Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build Hermes binaries
        run: |
          go build -o /dev/null ./cmd/reasonix-mcpbridge
          go build -o /dev/null ./cmd/reasonix-memoryserver
          go build -o /dev/null ./bot
          go build -o /dev/null ./cmd/reasonix-hooks
      - name: Test Hermes packages
        run: |
          go test -v -count=1 ./pkg/...
          go test -v -count=1 ./internal/bot/...
      - name: Test hook integration
        run: |
          bash scripts/test-hooks-integration.sh

  toml-lint:
    name: TOML Lint (taplo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/download/0.9.3/taplo-linux-x86_64.gz | gunzip -c | sudo tee /usr/local/bin/taplo > /dev/null
          sudo chmod +x /usr/local/bin/taplo
      - name: Check TOML formatting
        run: taplo check
