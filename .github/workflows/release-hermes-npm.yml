name: Release Hermes npm

on:
  push:
    tags: ['hermes-npm-v*']
  workflow_dispatch:
    inputs:
      base_version:
        description: "canary: intended next stable version, e.g. 1.7.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: publish reasonix-hermes npm packages
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="${{ inputs.base_version }}"; base="${base#v}"
            echo "arg=v${base}-canary.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check auth method
        id: auth
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo "Using NPM_TOKEN (classic automation token)"
          else
            echo "method=oidc" >> "$GITHUB_OUTPUT"
            echo "No NPM_TOKEN set — using OIDC"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm auth
        run: |
          echo "=== npm whoami ==="
          npm whoami --registry https://registry.npmjs.org 2>&1 || echo "(not authenticated — will attempt during publish)"

      - name: Publish (classic token)
        if: steps.auth.outputs.method == 'token'
        run: node npm/build-hermes.mjs "${{ steps.ver.outputs.arg }}" --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (OIDC)
        if: steps.auth.outputs.method == 'oidc'
        run: node npm/build-hermes.mjs "${{ steps.ver.outputs.arg }}" --publish
